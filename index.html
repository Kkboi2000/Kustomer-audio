<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kustom audio</title>
  <meta name="description" content="Record a sound, then pad it, flip it, or loop it.">
  <meta name="theme-color" content="#3240d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kustom">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Page 1: title -->
  <section id="home" class="view" hidden>
    <div class="home-stage">
      <h1 class="wordmark" aria-label="Kustom audio" tabindex="-1">
        <span class="line" aria-hidden="true"><span style="--i:0">K</span><span style="--i:1">u</span><span style="--i:2">s</span><span style="--i:3">t</span><span style="--i:4">o</span><span style="--i:5">m</span></span>
        <span class="line" aria-hidden="true"><span style="--i:6">a</span><span style="--i:7">u</span><span style="--i:8">d</span><span style="--i:9">i</span><span style="--i:10">o</span></span>
      </h1>
      <a class="key start" href="#/tools">Start</a>
    </div>
    <p class="signature">Krit's vibe code</p>
  </section>

  <!-- Page 2: tool selection -->
  <section id="tools" class="view" hidden>
    <header class="view-head">
      <h1 class="view-title" tabindex="-1">Pick a tool</h1>
    </header>
    <nav aria-label="Tools">
      <ul class="tool-list">
        <li>
          <a class="key tool-key" href="#/kustom" style="--face: var(--pad)">
            <span class="tool-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><rect x="2" y="2" width="9" height="9" rx="2.5"/><rect x="13" y="2" width="9" height="9" rx="2.5"/><rect x="2" y="13" width="9" height="9" rx="2.5"/><rect x="13" y="13" width="9" height="9" rx="2.5" fill-opacity=".35"/></svg>
            </span>
            <span><span class="tool-name">Kustom</span><span class="tool-desc">Your own sound pads, saved in groups</span></span>
          </a>
        </li>
        <li>
          <a class="key tool-key" href="#/reverse" style="--face: var(--signal)">
            <span class="tool-glyph" aria-hidden="true">⟲</span>
            <span><span class="tool-name">Reverse</span><span class="tool-desc">Record a sound and play it backwards</span></span>
          </a>
        </li>
        <li>
          <a class="key tool-key" href="#/dj" style="--face: var(--rec)">
            <span class="tool-glyph" aria-hidden="true">∞</span>
            <span><span class="tool-name">DJ</span><span class="tool-desc">Record once and it loops until you stop it</span></span>
          </a>
        </li>
      </ul>
    </nav>
  </section>

  <!-- Page 3: the selected tool -->
  <section id="tool" class="view" hidden>
    <header class="view-head">
      <a class="key back" id="back" href="#/tools" aria-label="Back to tools">←</a>
      <h1 class="view-title" id="tool-title" tabindex="-1"></h1>
      <div class="tool-actions" id="tool-actions"></div>
    </header>
    <div id="tool-body"></div>
  </section>

  <!-- One reusable bottom sheet for menus, prompts and recording -->
  <dialog id="sheet" class="sheet"></dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
